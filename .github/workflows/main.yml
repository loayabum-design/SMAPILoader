name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Project
        run: dotnet build -c Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMAPILoader-Output
          path: '**/bin/Release/**'
